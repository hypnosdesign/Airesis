services:
  airesis:
    build: .
    command: bundle exec rails s -b 0.0.0.0 --pid /tmp/server.pid
    environment:
      - DATABASE_URL=postgresql://postgres@db
      - RAILS_ENV=development
    volumes:
      - .:/usr/src/app
      - node_modulesYarn4:/usr/src/app/node_modules
    depends_on:
      - db
    ports:
      - "${AIRESIS_WEB_PORT:-3001}:3000"

  solid_queue:
    build: .
    command: bundle exec rails solid_queue:start
    environment:
      - DATABASE_URL=postgresql://postgres@db
      - RAILS_ENV=development
    depends_on:
      - db
    volumes:
      - .:/usr/src/app
      - node_modulesYarn4:/usr/src/app/node_modules

  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "8025:8025"
      - "1025:1025"

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - airesisDB18:/var/lib/postgresql
    ports:
      - "${AIRESIS_POSTGRES_PORT:-5434}:5432"

volumes:
  airesisDB18:
  node_modulesYarn4:
