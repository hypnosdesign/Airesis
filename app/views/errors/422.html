<!DOCTYPE html>
<html lang="en-EU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request rejected</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; font-family: "Sora", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { align-items: center; background: #eceff4; color: #2e3440; display: flex; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
    main { background: #fff; border: 1px solid #d8dee9; border-radius: 16px; box-shadow: 0 24px 60px -36px rgba(46, 52, 64, .65); max-width: 640px; padding: clamp(32px, 7vw, 64px); text-align: center; width: 100%; }
    .icon { align-items: center; background: #e5e9f0; border-radius: 16px; display: inline-flex; font-size: 20px; height: 56px; justify-content: center; width: 56px; }
    h1 { font-size: clamp(32px, 7vw, 48px); letter-spacing: -.03em; line-height: 1.1; margin: 24px 0 0; text-wrap: balance; }
    p { color: #4c566a; line-height: 1.65; margin: 16px auto 0; max-width: 48ch; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 32px; }
    a { border: 2px solid #5e81ac; border-radius: 10px; color: #2e3440; font-weight: 700; padding: 10px 16px; text-decoration: none; }
    a:first-child { background: #5e81ac; color: #fff; }
    a:focus-visible { outline: 3px solid #88c0d0; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">!</div>
    <h1>This request was rejected</h1>
    <p>Your session may have expired, or you may not have access to change this resource. Return to a safe page and try again.</p>
    <nav aria-label="Recovery options">
      <a href="/">Go to the homepage</a>
      <a href="/public">Explore public space</a>
    </nav>
  </main>
</body>
</html>
